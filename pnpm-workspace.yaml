packages:
  # The JavaScript SDK; the Python SDK next to it (sdk/python) is uv, not pnpm.
  - "sdk/js"
  # The command-line client.
  - "apps/cli"
  # The MCP server.
  - "packages/*"
  # Complete pipelines to copy: a JS SDK script, an n8n template and a README each.
  - "recipes"

# Installs and updates pick only versions published at least 7 days (10080 minutes) ago: a fresh release is where
# supply-chain attacks land and where a broken publish sits before its fix.
minimumReleaseAge: 10080

# Dependency build scripts: pnpm 10 runs only the allowed ones and warns about any declared neither way. esbuild
# (sdk/js's bundler): its postinstall verifies or fetches the platform binary. Nothing else in this tree has one.
onlyBuiltDependencies:
  - esbuild
