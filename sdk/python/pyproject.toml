[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imagestep"
dynamic = ["version"]
description = "ImageStep SDK — the image step for your automations"
readme = "README.md"
license = "MIT"
# PEP 639: both files land in `imagestep-<v>.dist-info/licenses/`, so `pip install imagestep`
# puts the notice on disk next to the code. THIRD-PARTY-NOTICES.md is generated by
# `scripts/sync-notices.mjs` from the repo root — do not edit the copy.
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md"]
requires-python = ">=3.10"
authors = [{ name = "ImageStep" }]
keywords = ["imagestep", "image", "api", "remove-background", "upscale", "image-generation", "automation", "n8n", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.urls]
Homepage = "https://imagestep.dev"
Documentation = "https://imagestep.dev/docs"
Repository = "https://github.com/imagestep/imagestep-sdk"
Issues = "https://imagestep.dev/support"

[tool.hatch.version]
path = "imagestep/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["imagestep", "tests", "examples", "scripts", "README.md", "pyproject.toml", "LICENSE", "THIRD-PARTY-NOTICES.md"]

[tool.hatch.build.targets.wheel]
packages = ["imagestep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# so `pytest sdk/python` from the monorepo root imports the source tree without an install
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
